[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ecosystem-predictor"
version = "0.2.0"
description = "Shared contracts and plugin registry for the Predictor ecosystem"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "coverage[toml]>=7.10,<8",
  "pre-commit>=4.3,<5",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ecosystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["contract: contract tests against the plugin protocol"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src/ecosystem"]
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["src/ecosystem"]
branch = true

[tool.coverage.report]
show_missing = true

