[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-research-bundle"
version = "1.0.0"
description = "Strict local research records, resources and lineage contract"
requires-python = ">=3.11"
dependencies = ["predictor-research-snapshot>=1.0.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_bundle = ["*.json"]
