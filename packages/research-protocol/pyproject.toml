[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-research-protocol"
version = "1.0.3rc1"
description = "Authenticated bounded CAIN to predictor research protocol"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8.4,<10"]
