[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "predictor-research-protocol"
version = "2.0.0rc2"
description = "Bounded CAIN to predictor research protocol (V1 authenticated envelope; V2 domain-contract envelope)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"research_protocol.v2" = ["data/*.json"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "jsonschema>=4.25,<5"]
