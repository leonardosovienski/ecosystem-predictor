name: CAIN CRIPTO pinned integration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CAIN_SHA: ad8217f9cd23d73a28a9f366509ca61274212fbd
  CRIPTO_SHA: 0963bb2cde2210a4b7d0f25cadd1f708a4bb95fa
  CAIN_ROLLBACK_SHA: ad430505290cd4bf5e5ad4de6c2e5f15f956c221
  CRIPTO_ROLLBACK_SHA: ee31ccc5688971c4332a6129c6d76b1f1f75ffe1
  ECOSYSTEM_ROLLBACK_SHA: 5a77854bdb61ca149c05591a5579a5b58b03090b
  SOURCE_DATE_EPOCH: "1758240000"
  CORE_SHA256: 10ef42f34ace8bb2df5f83ff7de2ceec79b035a25ea0a690e8942bd60d2fb4e3
  OPS_SHA256: da4fa540703879669caba919521ec7d3c33734b5d57781122823df8817346f0e
  CAIN_WHEEL_SHA256: 177253c8bfd0183e7b6bc99a001e24be9df94954dac687d88580b7b2c710a10c
  CRIPTO_WHEEL_SHA256: 45bb1b6e8c2dbef8ec388860ea24f27ffc09226bf867e2f1f3bf13201f825771
  ECOSYSTEM_WHEEL_SHA256: a918d8170d7b55a7fc65f552475e01158bbb3ad553581ac3b5d9cff5852ebc5c
  BUNDLE_WHEEL_SHA256: 50ca64dc5525f7d9d0fb635f4bfb8669426439bcb7a26b7dd944c27944dfd683
  PROTOCOL_WHEEL_SHA256: 7fb8f53876f876866934b22e10a6f6571852f1e8d152dacbf1c25f2e7d825112
  SNAPSHOT_WHEEL_SHA256: 040068d9c26f6c46a54259ca6b86ac7c1a1fc321e01720309f95831f5fefeec3

jobs:
  exact-stack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ecosystem
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: leonardosovienski/cain
          ref: ${{ env.CAIN_SHA }}
          path: cain
      - uses: actions/checkout@v4
        with:
          repository: leonardosovienski/cripto-predictor
          ref: ${{ env.CRIPTO_SHA }}
          path: crypto
      - uses: actions/checkout@v4
        with:
          repository: leonardosovienski/cain
          ref: ${{ env.CAIN_ROLLBACK_SHA }}
          path: cain-rollback
      - uses: actions/checkout@v4
        with:
          repository: leonardosovienski/cripto-predictor
          ref: ${{ env.CRIPTO_ROLLBACK_SHA }}
          path: crypto-rollback
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ECOSYSTEM_ROLLBACK_SHA }}
          path: ecosystem-rollback
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"

      - name: Verify exact source identities
        shell: pwsh
        run: |
          if ((git -C ecosystem rev-parse HEAD) -ne "${{ github.sha }}") { throw "ECOSYSTEM SHA drift" }
          if ((git -C cain rev-parse HEAD) -ne $env:CAIN_SHA) { throw "CAIN SHA drift" }
          if ((git -C crypto rev-parse HEAD) -ne $env:CRIPTO_SHA) { throw "CRIPTO SHA drift" }

      - name: Build every candidate wheel twice
        shell: pwsh
        run: |
          python -m pip install build==1.3.0
          New-Item -ItemType Directory dist-a,dist-b | Out-Null
          foreach ($out in @("dist-a", "dist-b")) {
            python -m build --wheel --outdir $out ecosystem/packages/research-snapshot
            python -m build --wheel --outdir $out ecosystem/packages/research-bundle
            python -m build --wheel --outdir $out ecosystem/packages/research-protocol
            python -m build --wheel --outdir $out ecosystem
            python -m build --wheel --outdir $out crypto
            python -m build --wheel --outdir $out cain
          }
          foreach ($wheel in Get-ChildItem dist-a/*.whl) {
            $peer = Join-Path dist-b $wheel.Name
            if (-not (Test-Path $peer)) { throw "missing second build: $($wheel.Name)" }
            if ((Get-FileHash $wheel).Hash -ne (Get-FileHash $peer).Hash) {
              throw "non-reproducible wheel: $($wheel.Name)"
            }
          }

      - name: Verify candidate and published artifact hashes
        shell: pwsh
        run: |
          $expected = @{
            "cain_research-0.4.13rc3-py3-none-any.whl" = $env:CAIN_WHEEL_SHA256
            "cripto_predictor-1.1.1rc2-py3-none-any.whl" = $env:CRIPTO_WHEEL_SHA256
            "ecosystem_predictor-0.2.0-py3-none-any.whl" = $env:ECOSYSTEM_WHEEL_SHA256
            "predictor_research_bundle-1.0.1rc1-py3-none-any.whl" = $env:BUNDLE_WHEEL_SHA256
            "predictor_research_protocol-1.0.2rc1-py3-none-any.whl" = $env:PROTOCOL_WHEEL_SHA256
            "predictor_research_snapshot-1.0.2rc1-py3-none-any.whl" = $env:SNAPSHOT_WHEEL_SHA256
          }
          foreach ($item in $expected.GetEnumerator()) {
            $actual = (Get-FileHash (Join-Path dist-a $item.Key)).Hash.ToLowerInvariant()
            if ($actual -ne $item.Value) { throw "candidate hash drift: $($item.Key)" }
          }
          New-Item -ItemType Directory published | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            https://github.com/leonardosovienski/core-predictor/releases/download/v3.2.1/predictor_core-3.2.1-py3-none-any.whl `
            -OutFile published/predictor_core-3.2.1-py3-none-any.whl
          Invoke-WebRequest -UseBasicParsing `
            https://github.com/leonardosovienski/predictor-ops/releases/download/v4.2.1/predictor_ops-4.2.1-py3-none-any.whl `
            -OutFile published/predictor_ops-4.2.1-py3-none-any.whl
          if ((Get-FileHash published/predictor_core-3.2.1-py3-none-any.whl).Hash.ToLowerInvariant() -ne $env:CORE_SHA256) { throw "CORE artifact drift" }
          if ((Get-FileHash published/predictor_ops-4.2.1-py3-none-any.whl).Hash.ToLowerInvariant() -ne $env:OPS_SHA256) { throw "OPS artifact drift" }

      - name: Install exact wheels
        shell: pwsh
        run: |
          $wheels = @(
            Get-ChildItem published/*.whl,dist-a/*.whl | ForEach-Object FullName
          )
          python -m pip install @wheels pytest==8.4.2
          python -m pip check

      - name: Installed-wheel E2E security chaos and recovery
        shell: pwsh
        run: |
          New-Item -ItemType Directory clean-tests/tests | Out-Null
          New-Item -ItemType File clean-tests/tests/__init__.py | Out-Null
          Copy-Item crypto/tests/test_research_execution.py clean-tests/tests/
          Copy-Item crypto/tests/test_research_recovery.py clean-tests/tests/
          Copy-Item crypto/tests/test_research_admission.py clean-tests/tests/
          Copy-Item crypto/tests/test_research_results.py clean-tests/tests/
          Copy-Item cain/tests/test_research_task_outbox.py clean-tests/tests/
          Copy-Item cain/tests/test_research_result_inbox.py clean-tests/tests/
          Copy-Item ecosystem/packages/research-protocol/tests/test_key_store.py clean-tests/tests/
          Push-Location clean-tests
          python -m pytest -q
          Pop-Location

      - name: Software rollback and forward repair preserve history
        shell: pwsh
        run: |
          New-Item -ItemType Directory rollback-dist | Out-Null
          python -m build --wheel --outdir rollback-dist ecosystem-rollback/packages/research-protocol
          python -m build --wheel --outdir rollback-dist crypto-rollback
          python -m build --wheel --outdir rollback-dist cain-rollback
          @'
          import hashlib, json, sqlite3
          from pathlib import Path
          root = Path("rollback-state")
          root.mkdir()
          artifact = root / "immutable-result.json"
          artifact.write_text('{"result_id":"RESULT-PRESERVED","scientific_state":"REFUTED"}', encoding="utf-8")
          db = sqlite3.connect(root / "history.sqlite")
          db.execute("create table history(result_id text primary key, state text not null)")
          db.execute("insert into history values('RESULT-PRESERVED','REFUTED')")
          db.commit(); db.close()
          Path("rollback-before.json").write_text(json.dumps({
              "artifact_sha256": hashlib.sha256(artifact.read_bytes()).hexdigest()
          }), encoding="utf-8")
          '@ | python -
          $rollbackWheels = @(Get-ChildItem rollback-dist/*.whl | ForEach-Object FullName)
          python -m pip install --force-reinstall --no-deps @rollbackWheels
          python -c "import cain, GarimpoInvestimentos, research_protocol; print(cain.__version__, GarimpoInvestimentos.__version__)"
          @'
          import hashlib, json, sqlite3
          from pathlib import Path
          before = json.loads(Path("rollback-before.json").read_text())
          artifact = Path("rollback-state/immutable-result.json")
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == before["artifact_sha256"]
          db = sqlite3.connect("rollback-state/history.sqlite")
          assert db.execute("select * from history").fetchall() == [("RESULT-PRESERVED", "REFUTED")]
          db.close()
          '@ | python -
          $currentWheels = @(Get-ChildItem dist-a/*.whl | ForEach-Object FullName)
          python -m pip install --force-reinstall --no-deps @currentWheels
          python -m pytest -q clean-tests/tests

      - name: Full pinned-source regressions and static gates
        shell: pwsh
        run: |
          python -m pip install -e "ecosystem[dev]" -e "cain[dev]" -e "crypto[science,test,excel]"
          python -m pytest -q ecosystem/tests ecosystem/packages/research-protocol/tests
          python -m pytest -q cain/tests
          python -m pytest -q crypto/tests
          python -m ruff check ecosystem cain crypto

      - name: Emit exact stack receipt
        shell: pwsh
        run: |
          $receipt = @{
            schema_version = "cross-project-ci-receipt/1"
            ecosystem_sha = "${{ github.sha }}"
            cain_sha = $env:CAIN_SHA
            cripto_sha = $env:CRIPTO_SHA
            python = (python --version)
            source_date_epoch = $env:SOURCE_DATE_EPOCH
            status = "PASS"
          }
          $receipt | ConvertTo-Json | Set-Content -Encoding utf8 cross-project-ci-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: cain-crypto-exact-stack-receipt
          path: cross-project-ci-receipt.json
