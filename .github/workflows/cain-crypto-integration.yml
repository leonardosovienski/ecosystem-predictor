name: CAIN CRIPTO pinned integration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CAIN_SHA: ad430505290cd4bf5e5ad4de6c2e5f15f956c221
  CRIPTO_SHA: 8a0ac5844292719101a4ebe107f187939e1e15ed
  SOURCE_DATE_EPOCH: "1758240000"

jobs:
  exact-stack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ecosystem
      - uses: actions/checkout@v4
        with:
          repository: leonardosovienski/cain
          ref: ${{ env.CAIN_SHA }}
          path: cain
      - uses: actions/checkout@v4
        with:
          repository: leonardosovienski/cripto-predictor
          ref: ${{ env.CRIPTO_SHA }}
          path: crypto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
      - name: Verify exact source identities
        shell: pwsh
        run: |
          if ((git -C cain rev-parse HEAD) -ne $env:CAIN_SHA) { throw "CAIN SHA drift" }
          if ((git -C crypto rev-parse HEAD) -ne $env:CRIPTO_SHA) { throw "CRIPTO SHA drift" }
      - name: Build candidate contracts and applications twice
        shell: pwsh
        run: |
          python -m pip install build==1.3.0
          New-Item -ItemType Directory -Force dist-a,dist-b | Out-Null
          foreach ($out in @("dist-a", "dist-b")) {
            python -m build --wheel --outdir $out ecosystem/packages/research-snapshot
            python -m build --wheel --outdir $out ecosystem/packages/research-bundle
            python -m build --wheel --outdir $out ecosystem/packages/research-protocol
            python -m build --wheel --outdir $out crypto
            python -m build --wheel --outdir $out cain
          }
          foreach ($wheel in Get-ChildItem dist-a/*.whl) {
            $peer = Join-Path dist-b $wheel.Name
            if ((Get-FileHash $wheel).Hash -ne (Get-FileHash $peer).Hash) {
              throw "non-reproducible wheel: $($wheel.Name)"
            }
          }
      - name: Install exact CORE OPS and candidate wheels
        shell: pwsh
        run: |
          python -m pip install `
            https://github.com/leonardosovienski/core-predictor/releases/download/v3.2.1/predictor_core-3.2.1-py3-none-any.whl `
            https://github.com/leonardosovienski/predictor-ops/releases/download/v4.2.1/predictor_ops-4.2.1-py3-none-any.whl
          python -m pip install (Get-ChildItem dist-a/*.whl | ForEach-Object FullName)
          python -m pip install pytest==8.4.2
      - name: Installed-wheel integration and semantic boundary tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory clean-tests | Out-Null
          Copy-Item crypto/tests/test_research_execution.py clean-tests/
          Copy-Item cain/tests/test_research_result_inbox.py clean-tests/
          Push-Location clean-tests
          python -m pytest -q
          Pop-Location
