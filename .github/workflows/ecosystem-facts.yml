name: Ecosystem facts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Mechanical ecosystem facts are current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_ecosystem_facts.py --check
