name: Ecosystem facts

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  explicit-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate the explicit six-project canonical snapshot
        run: python scripts/sync_canonical_ecosystem_facts.py --offline-check
