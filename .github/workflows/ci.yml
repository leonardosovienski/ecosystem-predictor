name: CI

on:
  push:
  pull_request:
  # O drift não precisa de um push para acontecer: basta outro repositório se mover.
  # Em 2026-09-06 o estado canônico estava três dias defasado sem nenhum commit aqui.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run coverage run -m pytest -q
      - run: uv run coverage report --fail-under=0
      - name: Canonical six-repository facts are internally consistent
        if: matrix.python == '3.13'
        run: uv run python scripts/sync_canonical_ecosystem_facts.py --offline-check
      - name: Registries are internally consistent
        if: matrix.python == '3.13'
        run: uv run python scripts/check_ecosystem_drift.py --offline-check
      - run: uv build
      - name: wheel smoke outside checkout
        run: |
          uv venv /tmp/ecosystem-wheel --python ${{ matrix.python }} --seed
          /tmp/ecosystem-wheel/bin/pip install dist/*.whl
          /tmp/ecosystem-wheel/bin/python -c "import ecosystem.contracts; import ecosystem.registry"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with: {path: ".", output-file: "sbom.spdx.json"}

  real-plugin-integration:
    name: Three real plugins installed together
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv venv /tmp/predictors-integration --python 3.13 --seed
      - name: Install ecosystem and real domain distributions
        run: |
          /tmp/predictors-integration/bin/pip install \
            "predictor-core @ https://github.com/leonardosovienski/core-predictor/releases/download/v3.2.0/predictor_core-3.2.0-py3-none-any.whl" \
            "predictor-ops @ https://github.com/leonardosovienski/predictor-ops/releases/download/v4.1.0/predictor_ops-4.1.0-py3-none-any.whl"
          /tmp/predictors-integration/bin/pip install . \
            "git+https://github.com/leonardosovienski/cripto-predictor.git" \
            "git+https://github.com/leonardosovienski/brasileirao-predictor.git" \
            "git+https://github.com/leonardosovienski/stocks-predictor.git"
      - name: Verify discovery, identity and domain isolation
        run: /tmp/predictors-integration/bin/python scripts/check_real_plugin_integration.py

  ecosystem-drift:
    name: Registries still match the six repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --python 3.13
      # Falha em versão, pin ou atestado divergente. SHA de main apenas vira aviso:
      # muda a cada merge legítimo, e vermelho constante ensina a ignorar vermelho.
      - name: Compare registries against every canonical repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/check_ecosystem_drift.py --token "$GITHUB_TOKEN"
