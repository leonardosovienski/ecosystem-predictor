name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
  # O drift não precisa de um push para acontecer: basta outro repositório se mover.
  # Em 2026-09-06 o estado canônico estava três dias defasado sem nenhum commit aqui.
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  actions: read

jobs:
  research-packages:
    # Cada pacote de packages/* tem uv.lock próprio e é testado pelo lock em
    # todas as versões de Python que declara (requires-python >=3.11).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        package: [research-snapshot, research-bundle, research-protocol, research-transport]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --locked --no-editable
      - run: uv run --locked --no-sync pytest tests -q
      - if: matrix.package == 'research-bundle'
        run: uv run --locked --no-sync python -I -c "import research_bundle; from importlib.resources import files; assert files('research_bundle').joinpath('contract.json').read_bytes()"
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.python }}
          path: packages/${{ matrix.package }}/dist/*.whl
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            experimental: false
          - python: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked pyright
      - run: uv run --no-sync coverage run -m pytest tests packages/research-snapshot/tests packages/research-bundle/tests -q
      - run: uv run --no-sync coverage report --fail-under=75
      - name: Current project representation
        if: matrix.python == '3.13'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --locked python scripts/check_current_representation.py
      - name: Historical six-repository facts remain internally consistent
        if: matrix.python == '3.13'
        run: uv run --locked python scripts/sync_canonical_ecosystem_facts.py --offline-check
      - name: Registries are internally consistent
        if: matrix.python == '3.13'
        run: uv run --locked python scripts/check_ecosystem_drift.py --offline-check
      - run: uv build
      - run: uv build --directory packages/research-snapshot --out-dir ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: ecosystem-distributions-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
      - name: wheel smoke outside checkout
        run: |
          uv venv /tmp/ecosystem-wheel --python ${{ matrix.python }} --seed
          /tmp/ecosystem-wheel/bin/pip install dist/*.whl
          /tmp/ecosystem-wheel/bin/python -c "import ecosystem.contracts; import ecosystem.registry"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: anchore/sbom-action@v0
        with: {path: ".", output-file: "sbom.spdx.json", upload-release-assets: false}

  ecosystem-drift:
    name: Seven-project immutable compatibility manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_architecture_manifest.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

